            OnSelect: =Patch(colIssues, LookUp(colIssues, Id = varIssueId), {Status:"In progress"}); Notify("Issue updated.",NotificationType.Success)
            PressedColor: =Brand.SecondaryText
            PressedFill: =Brand.PrimarySoft
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            RadiusTopLeft: =6
            RadiusTopRight: =6
