            FocusedBorderColor: =Brand.Focus
            Font: =Font.'Segoe UI'
            Height: =If(App.Width < 900, 32, 40)
            HoverColor: =Brand.AccentText
            HoverFill: =Brand.Accent
            OnSelect: =Set(varEditId,""); Set(varPriority,"Normal"); Set(varShowEditor,true); Reset(txtIssueTitle); Reset(txtImpact); Reset(txtNextStep); Reset(txtOwner)
