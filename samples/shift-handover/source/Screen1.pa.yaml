            HoverColor: =Brand.PrimaryText
            HoverFill: =Brand.Primary
            OnSelect: =Set(varEditId,varIssueId); Set(varPriority,LookUp(colIssues, Id = varIssueId).Priority); Set(varShowEditor,true); Reset(txtIssueTitle); Reset(txtImpact); Reset(txtNextStep); Reset(txtOwner)
