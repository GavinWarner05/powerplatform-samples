Screens:
  Screen1:
    Properties:
      Fill: =Brand.Canvas
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
    Children:
      - HtmlText1:
          Control: HtmlViewer@2.1.0
          Properties:
            DisabledBorderColor: =RGBA(161, 159, 157, 1)
            Font: =Font.'Segoe UI'
            Height: =Parent.Height
            HtmlText: ="<div style='position:relative;width:100%;height:" & Text(Parent.Height - 4) & "px;background:" & BrandCanvasCss & ";overflow:hidden;font-family:Segoe UI;'><div style='position:absolute;left:0;right:0;top:0;height:84px;background:" & BrandHeaderCss & ";'></div><div style='position:absolute;left:24px;top:24px;width:30px;height:30px;border-radius:9px;background:" & BrandAccentHex & ";color:" & Brand.AccentTextCss & ";font-size:25px;font-weight:800;text-align:center;line-height:27px;'>»</div>" & If(!varShowHistory && !varShowEditor, "<div style='position:absolute;left:16px;right:16px;top:96px;height:130px;border-radius:20px;background:linear-gradient(115deg," & BrandHeroStartCss & " 0%," & BrandHeroMiddleCss & " 65%," & BrandHeroEndCss & " 100%);overflow:hidden;box-shadow:0 8px 18px rgba(18,40,70,0.15);'><div style='position:absolute;right:165px;top:-105px;width:270px;height:270px;border:1px solid rgba(255,255,255,0.14);border-radius:50%;'></div><div style='position:absolute;right:120px;top:-60px;width:270px;height:270px;border:1px solid rgba(255,255,255,0.14);border-radius:50%;'></div></div>" & If(App.Width>=900 || varShowDetail, "<div style='position:absolute;left:" & Text(rctDetailSurface.X) & "px;top:238px;width:" & Text(rctDetailSurface.Width) & "px;height:" & Text(rctDetailSurface.Height) & "px;border-radius:18px;background:" & BrandSurfaceCss & ";box-shadow:0 6px 18px rgba(18,40,70,0.07);border:1px solid " & BrandSoftBorderCss & ";box-sizing:border-box;'><div style='height:5px;margin:0 22px;background:linear-gradient(90deg," & BrandPrimaryHex & "," & BrandAccentHex & ",transparent);border-radius:0 0 6px 6px;'></div></div>", "") & "<div style='position:absolute;left:16px;right:16px;top:" & Text(rctActionSurface.Y) & "px;height:" & Text(rctActionSurface.Height) & "px;border-radius:16px;background:" & BrandFooterCss & ";box-shadow:0 4px 12px rgba(18,40,70,0.12);'></div>", "") & "</div>"
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Width: =Parent.Width
      - rctActionSurface:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =ColorValue("#E1E7ED")
            BorderThickness: =1
            DisplayMode: =DisplayMode.View
            Fill: =Color.White
            Height: =If(App.Width >= 900, 64, 94)
