            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            RadiusTopLeft: =6
            RadiusTopRight: =6
            Size: =11
            Visible: =!varShowHistory && !varShowEditor
            Width: =Parent.Width - 80
            X: =40
            Y: =178
