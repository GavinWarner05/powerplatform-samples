                  Font: =Font.'Segoe UI'
                  Height: =22
                  OnSelect: =Select(Parent)
                  PaddingLeft: =0
                  PaddingRight: =0
                  Size: =10
                  Text: =ThisItem.Id & "  ·  " & ThisItem.Owner
                  Width: =Parent.TemplateWidth - 28
                  X: =14
                  Y: =42
            - lblIssueStatus:
                Control: Label@2.5.1
                Properties:
                  Color: =If(ThisItem.Id=varIssueId,Color.White,If(ThisItem.Priority="High",Brand.HighText,Brand.GoodText))
                  Font: =Font.'Segoe UI'
                  Height: =20
                  OnSelect: =Select(Parent)
                  PaddingLeft: =0
                  PaddingRight: =0
                  Size: =10
                  Text: =ThisItem.Status & "   /   " & ThisItem.Priority & " priority"
