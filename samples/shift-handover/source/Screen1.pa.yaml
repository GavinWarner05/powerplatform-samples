      - galIssues:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            AccessibleLabel: ="Issues linked to this handover"
            FocusedBorderThickness: =2
            Height: =Max(120, Parent.Height - If(App.Width < 900, 420, 372))
            Items: =Filter(colIssues, Id in Filter(colLinks, HandoverId = varHandoverId).IssueId)
            OnSelect: =Set(varIssueId, ThisItem.Id); Set(varShowDetail,true)
            TabIndex: =0
            TemplatePadding: =4
            TemplateSize: =88
            Visible: =!varShowHistory && !varShowEditor && (App.Width >= 900 || !varShowDetail)
            Width: =If(App.Width >= 900, App.Width * 0.43 - 36, App.Width - 48)
            X: =24
            Y: =If(App.Width < 900, 282, 264)
          Children:
            - htmlIssueSurface:
                Control: HtmlViewer@2.1.0
                Properties:
                  Height: =88
                  HtmlText: ="<div style='box-sizing:border-box;width:100%;height:86px;border-radius:14px;border:1px solid " & If(ThisItem.Id=varIssueId,BrandSelectedCss,BrandSoftBorderCss) & ";border-left:4px solid " & If(ThisItem.Priority="High","#F5B66B",If(ThisItem.Status="Resolved","#80C8B0","#39BFB0")) & ";background:" & If(ThisItem.Id=varIssueId,BrandSelectedCss,BrandSurfaceCss) & ";'></div>"
