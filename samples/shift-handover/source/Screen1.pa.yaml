                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =38
                  OnSelect: =Select(Parent)
                  PaddingLeft: =0
                  PaddingRight: =0
                  Text: =ThisItem.Title
                  Width: =Parent.TemplateWidth - 28
                  X: =14
                  Y: =8
            - lblIssueMeta:
                Control: Label@2.5.1
