            FocusedBorderColor: =Brand.Focus
            Font: =Font.'Segoe UI'
            Height: =44
            HintText: ="Shift summary"
            HoverBorderColor: =Brand.Focus
            HoverColor: =Self.Color
            HoverFill: =RGBA(0,0,0,0)
            Mode: =TextMode.MultiLine
            OnChange: =If(LookUp(colHandovers, Id = varHandoverId).Status = "Draft", Patch(colHandovers, LookUp(colHandovers, Id = varHandoverId), {Summary:Self.Text}))
