              =If(LookUp(colHandovers, Id = varHandoverId).Status = "Acknowledged", "Acknowledged by " & LookUp(colHandovers, Id = varHandoverId).AcknowledgedBy & " · " & Text(LookUp(colHandovers, Id = varHandoverId).AcknowledgedAt, "dd mmm hh:mm"), If(LookUp(colHandovers, Id = varHandoverId).Status = "Submitted", "Incoming shift: review the handover, then acknowledge.", "Complete the summary and issues, then submit."))
